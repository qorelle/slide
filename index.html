<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スライドショー</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="スライドショー">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root {
  --bg: #f5f5f7; --stage: #000; --tray: rgba(255,255,255,.88); --line: rgba(0,0,0,.12);
  --fg: #1d1d1f; --muted: #6e6e73; --chip: rgba(0,0,0,.06); --chip-on: #fff;
  --accent: #1d1d1f; --accent-fg: #fff;
  --font-ui: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Helvetica Neue", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #111; --tray: rgba(30,30,32,.88); --line: rgba(255,255,255,.12); --fg: #f5f5f7; --muted: #98989d;
  --chip: rgba(255,255,255,.08); --chip-on: rgba(255,255,255,.2); --accent: #f5f5f7; --accent-fg: #111; color-scheme: dark;
} }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-ui); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#stage { position: fixed; inset: 0; background: var(--stage); }
#stage:empty { background: var(--bg); }
#stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity .8s ease; }
#stage.cover img { object-fit: cover; }
#stage img.on { opacity: 1; }

#empty { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.welcome { max-width: 26rem; display: grid; gap: 16px; text-align: center; justify-items: center; }
.welcome h1 { margin: 0; font-size: 1.5rem; font-weight: 600; }
.welcome p { margin: 0; color: var(--muted); line-height: 1.7; font-size: .92rem; }
.welcome .fmt { font-size: .78rem; color: var(--muted); }
.picks { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }

.btn { appearance: none; border: 1px solid var(--line); background: var(--chip); color: var(--fg); font: inherit; font-size: .92rem; font-weight: 500; padding: 10px 16px; border-radius: 10px; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; padding: 12px 24px; }
.btn:focus-visible, .seg button:focus-visible, input:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

#tray { position: fixed; left: 0; right: 0; bottom: 0; background: var(--tray); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border-top: 1px solid var(--line);
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  transition: transform .3s ease; z-index: 5; }
#tray.away { transform: translateY(110%); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; }
.group { display: flex; align-items: center; gap: 10px; }
.label { font-size: .8rem; color: var(--muted); }
.sec { display: flex; align-items: center; gap: 10px; }
.sec input[type=range] { width: 160px; accent-color: var(--fg); }
.sec output { font-variant-numeric: tabular-nums; min-width: 3.6em; }
.seg { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 2px; gap: 2px; }
.seg button { appearance: none; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: .88rem; padding: 7px 14px; border-radius: 8px; cursor: pointer; }
.seg button[aria-pressed=true] { background: var(--chip-on); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.spacer { flex: 1; }
.count { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.play { width: 46px; height: 46px; padding: 0; display: grid; place-items: center; border-radius: 50%; }
.play svg { width: 18px; height: 18px; fill: currentColor; }
.note { margin-top: 10px; font-size: .78rem; color: var(--muted); }

#toast { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); background: var(--tray); color: var(--fg); border: 1px solid var(--line); padding: 8px 14px; border-radius: 999px; font-size: .85rem; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 6; max-width: calc(100% - 32px); }
#toast.show { opacity: 1; }
@media (max-width: 560px) { .sec input[type=range] { width: 120px; } }
@media (prefers-reduced-motion: reduce) { #stage img, #tray { transition: none; } }
</style>
</head>
<body>

<div id="stage"></div>

<div id="empty">
  <div class="welcome">
    <h1>スライドショー</h1>
    <p>ファイルアプリでフォルダを開き、右上の「選択」→「すべてを選択」→「開く」で画像を読み込みます。選んだ写真はこのアプリに保存され、次回は自動で始まります。</p>
    <div class="picks">
      <button class="btn primary" id="pickFiles">写真を選ぶ</button>
    </div>
    <div class="fmt">JPEG、PNG、HEIC、WebP、GIF、AVIF、TIFF、BMP に対応</div>
  </div>
</div>

<input type="file" id="fileInput" multiple accept="image/*,.heic,.heif,.webp,.avif,.tif,.tiff,.bmp,.gif,.png,.jpg,.jpeg" hidden>

<div id="tray" hidden>
  <div class="row">
    <button class="btn play" id="playBtn" aria-label="一時停止"><svg viewBox="0 0 24 24" id="playIcon"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></button>
    <div class="group">
      <span class="label">間隔</span>
      <div class="sec">
        <input type="range" id="secs" min="1" max="60" step="1" value="5" aria-label="切り替えの秒数">
        <output id="secsOut" for="secs">5 秒</output>
      </div>
    </div>
    <div class="group">
      <span class="label">順番</span>
      <div class="seg" role="group" aria-label="順番">
        <button id="ordName" aria-pressed="true">名前順</button>
        <button id="ordRand" aria-pressed="false">ランダム</button>
      </div>
    </div>
    <div class="group">
      <span class="label">表示</span>
      <div class="seg" role="group" aria-label="表示方法">
        <button id="fitContain" aria-pressed="true">全体</button>
        <button id="fitCover" aria-pressed="false">画面いっぱい</button>
      </div>
    </div>
    <span class="spacer"></span>
    <span class="count" id="count">0 / 0</span>
    <button class="btn" id="reBtn">写真を選び直す</button>
  </div>
  <div class="note" id="note" hidden></div>
</div>

<div id="toast"></div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

(() => {
  const $ = id => document.getElementById(id);
  const stage = $('stage'), tray = $('tray'), empty = $('empty');
  const IMG_EXT = /\.(jpe?g|png|gif|webp|avif|heic|heif|tiff?|bmp|jfif|apng)$/i;

  const store = {
    get(k, d) { try { const v = localStorage.getItem('ss.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('ss.' + k, JSON.stringify(v)); } catch {} }
  };

  // 選んだ写真をアプリ内に保存する
  const db = {
    open() {
      return new Promise((res, rej) => {
        const r = indexedDB.open('slideshow', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('photos', { autoIncrement: true });
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    },
    async save(files) {
      const d = await this.open();
      return new Promise((res, rej) => {
        const tx = d.transaction('photos', 'readwrite');
        const s = tx.objectStore('photos');
        s.clear();
        files.forEach(f => s.put({ name: f.name, blob: f }));
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
        tx.onabort = () => rej(tx.error);
      });
    },
    async load() {
      const d = await this.open();
      return new Promise((res, rej) => {
        const r = d.transaction('photos').objectStore('photos').getAll();
        r.onsuccess = () => res(r.result || []);
        r.onerror = () => rej(r.error);
      });
    }
  };

  let items = [], order = [], pos = 0, timer = null, playing = true, current = null, hideTimer = null, direction = 1;
  let secs = store.get('secs', 5), random = store.get('random', false), cover = store.get('cover', false);
  const collator = new Intl.Collator('ja', { numeric: true, sensitivity: 'base' });

  $('secs').value = secs; $('secsOut').textContent = secs + ' 秒';
  setSeg('ordName', 'ordRand', !random);
  setSeg('fitContain', 'fitCover', !cover);
  stage.classList.toggle('cover', cover);

  $('pickFiles').onclick = () => $('fileInput').click();
  $('reBtn').onclick = e => { e.stopPropagation(); $('fileInput').click(); };
  $('fileInput').onchange = async e => {
    const files = Array.from(e.target.files || []).filter(f => (f.type && f.type.startsWith('image/')) || IMG_EXT.test(f.name));
    e.target.value = '';
    if (!files.length) { toast('画像が見つかりませんでした'); return; }
    start(files.map(f => ({ name: f.name, blob: f })));
    try {
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
      toast('写真を保存しています…');
      await db.save(files);
      toast(files.length + ' 枚を保存しました。次回は自動で始まります');
    } catch {
      toast('写真が多すぎて保存できませんでした。今回はそのまま再生します');
    }
  };

  function setSeg(a, b, firstOn) { $(a).setAttribute('aria-pressed', firstOn); $(b).setAttribute('aria-pressed', !firstOn); }

  function start(list) {
    items.forEach(it => URL.revokeObjectURL(it.url));
    list.sort((a, b) => collator.compare(a.name, b.name));
    items = list.map(x => ({ name: x.name, url: URL.createObjectURL(x.blob), bad: false }));
    $('note').hidden = true;
    stage.innerHTML = ''; current = null;
    buildOrder(); pos = 0;
    empty.hidden = true; tray.hidden = false;
    playing = true; updatePlayIcon();
    show();
    requestWake();
    bumpTray();
  }

  function buildOrder() {
    order = items.map((_, i) => i);
    if (random) for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  }

  function step(d) {
    if (!items.length) return;
    direction = d >= 0 ? 1 : -1;
    pos += d;
    if (pos >= order.length) {
      const last = order[order.length - 1];
      buildOrder(); pos = 0;
      if (random && order.length > 1 && order[0] === last) [order[0], order[1]] = [order[1], order[0]];
    }
    if (pos < 0) pos = order.length - 1;
    show();
  }

  function show() {
    clearTimeout(timer);
    if (!items.some(i => !i.bad)) { $('note').textContent = '表示できる画像がありませんでした'; $('note').hidden = false; return; }
    const it = items[order[pos]];
    if (it.bad) { step(direction); return; }
    const img = new Image();
    img.alt = it.name;
    img.decoding = 'async';
    img.onload = () => {
      stage.appendChild(img);
      const prev = current; current = img;
      requestAnimationFrame(() => requestAnimationFrame(() => {
        img.classList.add('on');
        if (prev) { prev.classList.remove('on'); setTimeout(() => prev.remove(), 1000); }
      }));
      $('count').textContent = (pos + 1) + ' / ' + order.length;
      schedule();
    };
    img.onerror = () => {
      it.bad = true;
      $('note').textContent = items.filter(i => i.bad).length + ' 枚はこの端末で開けない形式だったので飛ばしています';
      $('note').hidden = false;
      step(direction);
    };
    img.src = it.url;
  }

  function schedule() { clearTimeout(timer); if (playing) timer = setTimeout(() => step(1), secs * 1000); }

  function updatePlayIcon() {
    $('playIcon').innerHTML = playing ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>' : '<path d="M7 4.5v15l12-7.5z"/>';
    $('playBtn').setAttribute('aria-label', playing ? '一時停止' : '再生');
  }

  $('playBtn').onclick = e => { e.stopPropagation(); playing = !playing; updatePlayIcon(); playing ? schedule() : clearTimeout(timer); bumpTray(); };

  $('secs').oninput = e => { secs = +e.target.value; $('secsOut').textContent = secs + ' 秒'; store.set('secs', secs); schedule(); bumpTray(); };

  const setOrder = r => e => {
    e.stopPropagation();
    if (random === r) return;
    random = r; store.set('random', r); setSeg('ordName', 'ordRand', !r);
    if (!items.length) return;
    const cur = order[pos]; buildOrder();
    if (r) { const k = order.indexOf(cur); [order[0], order[k]] = [order[k], order[0]]; pos = 0; } else pos = cur;
    $('count').textContent = (pos + 1) + ' / ' + order.length;
    schedule(); bumpTray();
  };
  $('ordName').onclick = setOrder(false);
  $('ordRand').onclick = setOrder(true);

  const setFit = c => e => { e.stopPropagation(); cover = c; store.set('cover', c); setSeg('fitContain', 'fitCover', !c); stage.classList.toggle('cover', c); bumpTray(); };
  $('fitContain').onclick = setFit(false);
  $('fitCover').onclick = setFit(true);

  function bumpTray() { tray.classList.remove('away'); clearTimeout(hideTimer); hideTimer = setTimeout(() => { if (items.length) tray.classList.add('away'); }, 3500); }
  tray.addEventListener('pointerdown', e => { e.stopPropagation(); bumpTray(); });

  let sx = 0, sy = 0, st = 0;
  stage.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; st = Date.now(); });
  stage.addEventListener('pointerup', e => {
    if (!items.length) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { step(dx < 0 ? 1 : -1); return; }
    if (Date.now() - st > 600) return;
    const x = e.clientX / innerWidth;
    if (x < 1/3) step(-1);
    else if (x > 2/3) step(1);
    else if (tray.classList.contains('away')) bumpTray();
    else { tray.classList.add('away'); clearTimeout(hideTimer); }
  });

  document.addEventListener('keydown', e => {
    if (!items.length) return;
    if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === ' ') { e.preventDefault(); $('playBtn').click(); }
  });

  async function requestWake() {
    try { if ('wakeLock' in navigator && document.visibilityState === 'visible') await navigator.wakeLock.request('screen'); } catch {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && items.length) requestWake(); });

  let toastT;
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

  // 前回保存した写真があれば自動で始める
  db.load().then(saved => { if (saved.length && !items.length) start(saved); }).catch(() => {});
})();
</script>
</body>
</html>
