<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>スライドショー</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="スライドショー">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root {
  --bg: #f5f5f7; --surface: #fff; --line: rgba(0,0,0,.12);
  --fg: #1d1d1f; --muted: #6e6e73; --chip: rgba(0,0,0,.06); --chip-on: #fff;
  --accent: #1d1d1f; --accent-fg: #fff; --danger: #d70015; --heart: #ff375f;
  --tray: rgba(255,255,255,.88);
  --font-ui: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Helvetica Neue", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #111; --surface: #1c1c1e; --line: rgba(255,255,255,.12); --fg: #f5f5f7; --muted: #98989d;
  --chip: rgba(255,255,255,.08); --chip-on: rgba(255,255,255,.2); --accent: #f5f5f7; --accent-fg: #111; --danger: #ff453a;
  --tray: rgba(30,30,32,.88); color-scheme: dark;
} }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-ui); -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

/* 一覧画面 */
.screen { position: fixed; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 32px) max(16px, env(safe-area-inset-left, 0px)); }
.wrap { max-width: 1200px; margin: 0 auto; display: grid; gap: 16px; }
.bar { display: flex; align-items: center; gap: 12px; min-height: 52px; }
.bar h1 { margin: 0; font-size: 1.7rem; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link { appearance: none; border: 0; background: none; font-size: 1rem; padding: 8px 4px; cursor: pointer; }
.link.muted { color: var(--muted); }
.link.danger { color: var(--danger); }
.btn { appearance: none; border: 1px solid var(--line); background: var(--chip); font-size: .92rem; font-weight: 500; padding: 10px 16px; border-radius: 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.btn:disabled { opacity: .4; cursor: default; }
.btn svg { width: 14px; height: 14px; fill: currentColor; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
.spacer { flex: 1; }
.seg { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 2px; gap: 2px; }
.seg button { appearance: none; border: 0; background: transparent; color: var(--muted); font-size: .88rem; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-variant-numeric: tabular-nums; }
.seg button[aria-pressed=true] { background: var(--chip-on); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px 16px; }
.card { appearance: none; border: 0; padding: 0; background: none; text-align: left; cursor: pointer; display: grid; gap: 8px; min-width: 0; }
.card .cover { aspect-ratio: 4 / 3; width: 100%; max-width: 100%; border-radius: 12px; background: var(--chip); overflow: hidden; }
.card .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .meta { font-size: .85rem; color: var(--muted); margin-top: -6px; font-variant-numeric: tabular-nums; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 3px; }
.cell { position: relative; aspect-ratio: 1; max-width: 100%; background: var(--chip); overflow: hidden; }
.cell img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: pointer; }
.fav { position: absolute; right: 4px; bottom: 4px; width: 38px; height: 38px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; padding: 0; }
.fav svg, .vheart svg, #pop svg { fill: none; stroke: #fff; stroke-width: 2; }
.fav svg { width: 22px; height: 22px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
.on > svg { fill: var(--heart); stroke: var(--heart); }
.emptyBox { padding: 56px 16px; text-align: center; color: var(--muted); display: grid; gap: 14px; justify-items: center; line-height: 1.7; }

/* 再生画面（常に暗い） */
#viewer { position: fixed; inset: 0; background: #000; z-index: 10; color: #f5f5f7;
  --tray: rgba(30,30,32,.86); --line: rgba(255,255,255,.12); --fg: #f5f5f7; --muted: #98989d; --chip: rgba(255,255,255,.08); --chip-on: rgba(255,255,255,.2); }
#stage { position: absolute; inset: 0; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
#stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity .8s ease; pointer-events: none; -webkit-user-drag: none; }
#stage.cover img { object-fit: cover; }
#stage img.on { opacity: 1; }
#stage img.drag { transition: none; }
#stage img.slide { transition: transform .3s cubic-bezier(.2,.7,.2,1); }

#vTop { position: absolute; z-index: 6; top: calc(env(safe-area-inset-top, 0px) + 12px); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; transition: opacity .3s; }
#vTop button { width: 46px; height: 46px; border-radius: 50%; border: 0; background: rgba(0,0,0,.45); color: #fff; display: grid; place-items: center; cursor: pointer; padding: 0; }
#vTop svg { width: 22px; height: 22px; }
#vClose svg { stroke: #fff; stroke-width: 2; fill: none; }
.away { opacity: 0; pointer-events: none; }

#tray { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--tray); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border-top: 1px solid var(--line);
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); transition: transform .3s ease, opacity .3s; }
#tray.away { transform: translateY(110%); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; }
.group { display: flex; align-items: center; gap: 10px; }
.label { font-size: .8rem; color: var(--muted); }
.sec { display: flex; align-items: center; gap: 10px; }
.sec input[type=range] { width: 160px; accent-color: #f5f5f7; }
.sec output { font-variant-numeric: tabular-nums; min-width: 3.6em; }
.count { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.play { width: 46px; height: 46px; padding: 0; justify-content: center; border-radius: 50%; }
.play svg { width: 18px; height: 18px; }

#pop { position: absolute; left: 50%; top: 50%; width: 110px; height: 110px; margin: -55px 0 0 -55px; pointer-events: none; opacity: 0; transform: scale(.6); z-index: 5; }
#pop svg { width: 100%; height: 100%; filter: drop-shadow(0 2px 10px rgba(0,0,0,.4)); }
#pop.show { animation: pop .7s ease forwards; }
@keyframes pop { 0% { opacity: 0; transform: scale(.6); } 25% { opacity: 1; transform: scale(1.05); } 60% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }

#busy { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.45); display: grid; place-items: center; }
#busy .busyBox { background: var(--surface); color: var(--fg); padding: 20px 24px; border-radius: 14px; font-variant-numeric: tabular-nums; display: grid; gap: 14px; justify-items: center; min-width: 220px; }
#modal { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 24px 16px; }
.mbox { width: 100%; max-width: 360px; background: var(--surface); color: var(--fg); border-radius: 16px; padding: 20px; display: grid; gap: 12px; }
.mbox h3 { margin: 0; font-size: 1.05rem; font-weight: 600; text-wrap: balance; }
.mbox p { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.6; }
.mbox input { width: 100%; font: inherit; font-size: 1rem; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.mbtns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
.btn.danger { background: var(--danger); color: #fff; }
#toast { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); background: var(--tray); color: var(--fg); border: 1px solid var(--line); padding: 8px 16px; border-radius: 999px; font-size: .88rem; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 30; max-width: calc(100% - 32px); text-align: center; -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
#toast.show { opacity: 1; }
#lock { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; place-items: center;
  padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.lockBox { width: 100%; max-width: 320px; display: grid; gap: 14px; justify-items: center; text-align: center; }
.lockBox svg { width: 40px; height: 40px; fill: none; stroke: var(--fg); stroke-width: 1.6; }
.lockBox h2 { margin: 0; font-size: 1.25rem; font-weight: 600; }
.lockMsg { margin: 0; min-height: 1.5em; font-size: .88rem; color: var(--muted); }
.lockMsg.err { color: var(--danger); }
#lockForm { width: 100%; display: grid; gap: 10px; }
#lockForm input { width: 100%; font: inherit; font-size: 1.1rem; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); text-align: center; }
#lockForm .btn { justify-content: center; padding: 12px; }
.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
@media (max-width: 560px) { .sec input[type=range] { width: 110px; } .grid { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); } }
@media (prefers-reduced-motion: reduce) { #stage img, #tray, #vTop { transition: none; } #pop.show { animation-duration: .01s; } }
</style>
</head>
<body>

<!-- プロジェクト一覧 -->
<section id="home" class="screen">
  <div class="wrap">
    <div class="bar">
      <h1>スライドショー</h1>
      <button class="link muted" id="changePw">パスワード変更</button>
      <button class="btn primary" id="newProj">新しいプロジェクト</button>
    </div>
    <div class="cards" id="projList"></div>
    <div class="emptyBox" id="homeEmpty" hidden>
      <div>プロジェクトはまだありません。<br>「新しいプロジェクト」を押して、ファイルアプリのフォルダから写真を選んでください。<br>フォルダの中で右上の「選択」→「すべてを選択」→「開く」でまとめて選べます。</div>
    </div>
  </div>
</section>

<!-- プロジェクトの中身 -->
<section id="project" class="screen" hidden>
  <div class="wrap">
    <div class="bar">
      <button class="link" id="backHome" aria-label="プロジェクト一覧に戻る">‹ 一覧</button>
      <h1 id="projName"></h1>
      <button class="link muted" id="renameProj">名前を変更</button>
    </div>
    <div class="toolbar">
      <button class="btn primary" id="playProj"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg>再生</button>
      <div class="seg" role="group" aria-label="表示する写真">
        <button id="fAll" aria-pressed="true">すべて</button>
        <button id="fFav" aria-pressed="false">お気に入り</button>
      </div>
      <span class="spacer"></span>
      <button class="btn" id="addPhotos">写真を追加</button>
      <button class="link danger" id="delProj">削除</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="emptyBox" id="gridEmpty" hidden></div>
  </div>
</section>

<!-- 再生 -->
<div id="viewer" hidden>
  <div id="stage"></div>
  <div id="pop"></div>
  <div id="vTop">
    <button id="vClose" aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <button id="vHeart" class="vheart" aria-label="お気に入り" aria-pressed="false"></button>
  </div>
  <div id="tray">
    <div class="row">
      <button class="btn play" id="playBtn" aria-label="一時停止"><svg viewBox="0 0 24 24" id="playIcon"></svg></button>
      <div class="group">
        <span class="label">間隔</span>
        <div class="sec">
          <input type="range" id="secs" min="1" max="60" step="1" value="5" aria-label="切り替えの秒数">
          <output id="secsOut" for="secs">5 秒</output>
        </div>
      </div>
      <div class="group">
        <span class="label">順番</span>
        <div class="seg" role="group" aria-label="順番">
          <button id="ordName" aria-pressed="true">名前順</button>
          <button id="ordRand" aria-pressed="false">ランダム</button>
        </div>
      </div>
      <div class="group">
        <span class="label">表示</span>
        <div class="seg" role="group" aria-label="表示方法">
          <button id="fitContain" aria-pressed="true">全体</button>
          <button id="fitCover" aria-pressed="false">画面いっぱい</button>
        </div>
      </div>
      <span class="spacer"></span>
      <span class="count" id="count"></span>
    </div>
  </div>
</div>

<input type="file" id="fileInput" multiple accept="image/*,.heic,.heif,.webp,.avif,.tif,.tiff,.bmp,.gif,.png,.jpg,.jpeg" hidden>
<div id="lock">
  <div class="lockBox">
    <svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
    <h2 id="lockTitle">パスワードを入力</h2>
    <p class="lockMsg" id="lockMsg"></p>
    <form id="lockForm" autocomplete="off">
      <input type="password" id="pw1" aria-label="パスワード" placeholder="パスワード">
      <input type="password" id="pw2" aria-label="もう一度入力" placeholder="もう一度入力" hidden>
      <button class="btn primary" type="submit" id="lockBtn">開く</button>
    </form>
    <button class="link muted" id="cancelChange" hidden>キャンセル</button>
    <button class="link muted" id="forgot">パスワードを忘れた場合</button>
  </div>
</div>

<div id="busy" hidden><div class="busyBox"><div id="busyText">読み込み中…</div><button class="btn" id="busyCancel" hidden>中止</button></div></div>
<div id="modal" hidden>
  <form class="mbox" id="mForm">
    <h3 id="mTitle"></h3>
    <p id="mText"></p>
    <input id="mInput" type="text" aria-label="名前" hidden>
    <div class="mbtns"><button type="button" class="btn" id="mCancel">キャンセル</button><button type="submit" class="btn primary" id="mOk">OK</button></div>
  </form>
</div>
<div id="toast"></div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

(() => {
  const $ = id => document.getElementById(id);
  const HEART = '<svg viewBox="0 0 24 24"><path d="M12 20.3s-7.4-4.5-9.2-9.1C1.5 7.9 3.5 4.6 7 4.6c2 0 3.5 1.1 5 3 1.5-1.9 3-3 5-3 3.5 0 5.5 3.3 4.2 6.6-1.8 4.6-9.2 9.1-9.2 9.1z"/></svg>';
  const IMG_EXT = /\.(jpe?g|png|gif|webp|avif|heic|heif|tiff?|bmp|jfif|apng)$/i;
  const collator = new Intl.Collator('ja', { numeric: true, sensitivity: 'base' });
  const byName = (a, b) => collator.compare(a.name, b.name);

  const store = {
    get(k, d) { try { const v = localStorage.getItem('ss.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('ss.' + k, JSON.stringify(v)); } catch {} }
  };
  let secs = store.get('secs', 5), random = store.get('random', false), cover = store.get('cover', false);

  /* ---------- 保存（iPadの中） ---------- */
  // projects: プロジェクト（名前・お気に入りの一覧）
  // items:    写真の名前と小さなサムネイル
  // blobs:    表示用の写真（画面サイズに縮めたもの）。必要なときだけ1枚ずつ読む
  const DB_NAME = 'slideshow-v3';
  let dbp = null;
  function openDB() {
    if (!dbp) dbp = new Promise((res, rej) => {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore('projects', { keyPath: 'id', autoIncrement: true });
        d.createObjectStore('items', { keyPath: 'id', autoIncrement: true }).createIndex('project', 'projectId');
        d.createObjectStore('blobs', { keyPath: 'id' });
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => { dbp = null; rej(r.error); };
      r.onblocked = () => { dbp = null; rej(new Error('blocked')); };
    });
    return dbp;
  }
  const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const doneP = t => new Promise((res, rej) => { t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });

  async function listProjects() { const d = await openDB(); return reqP(d.transaction('projects').objectStore('projects').getAll()); }
  async function getProject(id) { const d = await openDB(); return reqP(d.transaction('projects').objectStore('projects').get(id)); }
  async function getItems(pid) { const d = await openDB(); return reqP(d.transaction('items').objectStore('items').index('project').getAll(pid)); }
  async function getBlob(id) { const d = await openDB(); const r = await reqP(d.transaction('blobs').objectStore('blobs').get(id)); return r && r.blob; }
  async function putProject(p) {
    const d = await openDB(); const t = d.transaction('projects', 'readwrite'); const dn = doneP(t);
    const id = await reqP(t.objectStore('projects').put(p)); await dn; return id;
  }
  // 数枚ずつまとめて保存する（一度に大量に書くとiPadのメモリが足りなくなる）
  async function writeBatch(pid, recs) {
    const d = await openDB(); const t = d.transaction(['items', 'blobs'], 'readwrite'); const dn = doneP(t);
    const is = t.objectStore('items'), bs = t.objectStore('blobs');
    recs.forEach(r => {
      const q = is.add({ projectId: pid, name: r.name, size: r.size, thumb: r.thumb, added: Date.now() });
      q.onsuccess = () => bs.put({ id: q.result, blob: r.display });
    });
    return dn;
  }
  async function deleteProject(pid) {
    const d = await openDB(); const t = d.transaction(['projects', 'items', 'blobs'], 'readwrite'); const dn = doneP(t);
    t.objectStore('projects').delete(pid);
    const is = t.objectStore('items'), bs = t.objectStore('blobs');
    const r = is.index('project').getAllKeys(pid);
    r.onsuccess = () => r.result.forEach(k => { is.delete(k); bs.delete(k); });
    return dn;
  }

  /* ---------- 共通 ---------- */
  let toastT;
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200); }
  let busyCancel = false;
  function busy(on, text, cancellable) {
    $('busy').hidden = !on; if (text) $('busyText').textContent = text;
    $('busyCancel').hidden = !cancellable;
    if (on && !cancellable) busyCancel = false;
  }
  $('busyCancel').onclick = () => { busyCancel = true; $('busyText').textContent = '中止しています…'; };
  function setSeg(a, b, firstOn) { $(a).setAttribute('aria-pressed', firstOn); $(b).setAttribute('aria-pressed', !firstOn); }
  function showScreen(id) { ['home', 'project'].forEach(s => $(s).hidden = s !== id); }

  // アプリ内の確認・入力ダイアログ
  function ask({ title, text = '', value = null, ok = 'OK', danger = false }) {
    return new Promise(res => {
      $('mTitle').textContent = title; $('mText').textContent = text; $('mText').hidden = !text;
      const inp = $('mInput'); inp.hidden = value === null; inp.value = value || '';
      $('mOk').textContent = ok; $('mOk').classList.toggle('danger', danger);
      $('modal').hidden = false;
      if (value !== null) setTimeout(() => { try { inp.focus(); inp.select(); } catch {} }, 60);
      const close = v => { $('modal').hidden = true; $('mForm').onsubmit = null; $('mCancel').onclick = null; res(v); };
      $('mForm').onsubmit = e => { e.preventDefault(); close(value === null ? true : inp.value); };
      $('mCancel').onclick = () => close(null);
    });
  }

  // 写真を読み込んで、表示用（画面サイズ）とサムネイルを作る
  const cvs = document.createElement('canvas');
  function decode(blob, ms) {
    return new Promise(res => {
      const url = URL.createObjectURL(blob); const img = new Image(); let done = false;
      const fin = v => { if (done) return; done = true; clearTimeout(tm); URL.revokeObjectURL(url); res(v); };
      const tm = setTimeout(() => { img.src = ''; fin(null); }, ms);
      img.onload = () => fin(img.naturalWidth && img.naturalHeight ? img : null);
      img.onerror = () => fin(null);
      img.src = url;
    });
  }
  function renderTo(img, k, quality) {

    V.anim = true;
    requestAnimationFrame(() => {
      if (dir === 1) { V.cur.style.transform = 'translateX(' + (-W) + 'px)'; d.next.style.transform = 'translateX(0)'; d.prev.style.transform = 'translateX(' + (-2 * W) + 'px)'; }
      else if (dir === -1) { V.cur.style.transform = 'translateX(' + W + 'px)'; d.prev.style.transform = 'translateX(0)'; d.next.style.transform = 'translateX(' + (2 * W) + 'px)'; }
      else { V.cur.style.transform = 'translateX(0)'; if (d.next) d.next.style.transform = 'translateX(' + W + 'px)'; if (d.prev) d.prev.style.transform = 'translateX(' + (-W) + 'px)'; }
    });
    setTimeout(() => {
      const keep = dir === 1 ? d.next : dir === -1 ? d.prev : V.cur;
      els.forEach(x => { if (x !== keep) x.remove(); });
      keep.classList.remove('slide'); keep.style.transform = '';
      V.cur = keep; V.anim = false;
      if (dir) V.pos = wrapI(V.pos + dir);
      updateInfo(); schedule();
    }, 320);
  }
  function handleTap() {
    const now = Date.now();
    if (now - lastTap < 300) { clearTimeout(tapT); lastTap = 0; favCurrent(); return; }
    lastTap = now;
    tapT = setTimeout(toggleControls, 300);
  }

  document.addEventListener('keydown', e => {
    if ($('viewer').hidden || V.anim) return;
    if (e.key === 'ArrowRight') showAt(V.pos + 1);
    else if (e.key === 'ArrowLeft') showAt(V.pos - 1);
    else if (e.key === ' ') { e.preventDefault(); $('playBtn').click(); }
    else if (e.key === 'Escape') closeViewer();
  });

  async function requestWake() {
    try { if ('wakeLock' in navigator && document.visibilityState === 'visible') V.wake = await navigator.wakeLock.request('screen'); } catch {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !$('viewer').hidden) requestWake(); });

  /* ---------- パスワード ---------- */
  const LOCK_KEY = 'ss.lock';
  let lockMode = null, locked = true;
  const getLock = () => { try { return JSON.parse(localStorage.getItem(LOCK_KEY)); } catch { return null; } };
  async function hashPw(pw, salt) {
    const s = salt + ':' + pw;
    if (window.crypto && crypto.subtle) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    let h = 5381; for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0; return 'x' + h;
  }
  function lockMsg(t, err) { const m = $('lockMsg'); m.textContent = t; m.classList.toggle('err', !!err); }
  function showLock(mode) {
    lockMode = mode;
    if (mode !== 'change') { locked = true; clearTimeout(V.timer); }
    $('lock').hidden = false;
    $('pw1').value = ''; $('pw2').value = '';
    $('pw2').hidden = mode === 'unlock';
    $('forgot').hidden = mode !== 'unlock';
    $('cancelChange').hidden = mode !== 'change';
    $('lockTitle').textContent = mode === 'unlock' ? 'パスワードを入力' : mode === 'setup' ? 'パスワードを設定' : '新しいパスワード';
    $('lockBtn').textContent = mode === 'unlock' ? '開く' : '設定する';
    $('pw1').autocomplete = mode === 'unlock' ? 'current-password' : 'new-password';
    lockMsg(mode === 'setup' ? '起動するたびに、このパスワードで開きます' : '');
    setTimeout(() => { try { $('pw1').focus(); } catch {} }, 50);
  }
  function lockNow() { showLock(getLock() ? 'unlock' : 'setup'); }
  function unlockDone() {
    $('lock').hidden = true; locked = false; lockMode = null;
    if (!$('viewer').hidden) { schedule(); requestWake(); }
  }
  $('lockForm').addEventListener('submit', async e => {
    e.preventDefault();
    const p1 = $('pw1').value, p2 = $('pw2').value;
    if (lockMode === 'unlock') {
      const L = getLock();
      if (L && await hashPw(p1, L.salt) === L.hash) { unlockDone(); return; }
      lockMsg('パスワードが違います', true); $('pw1').value = '';
      const b = $('lockForm'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
      return;
    }
    if (p1.length < 4) { lockMsg('4文字以上にしてください', true); return; }
    if (p1 !== p2) { lockMsg('2回の入力が一致しません', true); $('pw2').value = ''; return; }
    const salt = Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b => b.toString(16).padStart(2, '0')).join('');
    try { localStorage.setItem(LOCK_KEY, JSON.stringify({ salt, hash: await hashPw(p1, salt) })); }
    catch { lockMsg('保存できませんでした', true); return; }
    toast('パスワードを設定しました');
    unlockDone();
  });
  $('changePw').onclick = () => showLock('change');
  $('cancelChange').onclick = () => { $('lock').hidden = true; lockMode = null; };
  $('forgot').onclick = async () => {
    const ok = await ask({ title: 'パスワードをリセットしますか？', text: 'このアプリに保存したプロジェクトとお気に入りがすべて削除されます。ファイルアプリの元の写真は消えません。', ok: 'リセット', danger: true });
    if (!ok) return;
    try { if (dbp) (await dbp).close(); } catch {}
    try { localStorage.removeItem(LOCK_KEY); } catch {}
    let left = 2; const next = () => { if (--left === 0) location.reload(); };
    ['slideshow-v3', 'slideshow-v2'].forEach(n => { const r = indexedDB.deleteDatabase(n); r.onsuccess = r.onerror = r.onblocked = next; });
  };
  // アプリを閉じたり別のアプリに切り替えたら、すぐ鍵をかける
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && lockMode !== 'setup' && !picking) lockNow(); });
  window.addEventListener('pagehide', () => { if (lockMode !== 'setup' && !picking) lockNow(); });

  // iPad の Safari で画面全体が拡大されないようにする
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));

  updatePlayIcon();
  lockNow();
  showHome();
})();
</script>
</body>
</html>
